<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pra você, Pri ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Quicksand:wght@500&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%}body{display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,#ffd6e0,#ff8fa3 55%,#e63757);font-family:Quicksand,sans-serif;color:#fff;overflow:hidden}
main{padding:28px;max-width:560px;position:relative;z-index:2;animation:in 2s ease both}p{font-size:1.15rem;margin:0 0 22px;text-shadow:0 1px 6px #0003}
h1{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:clamp(1.9rem,8vw,3rem);line-height:1.25;margin:0;text-shadow:0 2px 12px #0004}small{display:block;margin-top:28px;font-size:1.1rem}
.h{position:absolute;bottom:-40px;animation:up linear infinite;opacity:.7;z-index:1}@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}@keyframes in{from{opacity:0;transform:translateY(16px)}}</style></head><body>
<main><p>Nada não, meu amor 😊 criei essa página só pra você saber que:</p><h1>Priscila, eu te amo, e nós vamos criar uma família linda juntos ❤️</h1><small>— Arthur</small></main>
<script>for(let i=0;i<22;i++){const e=document.createElement('div');e.className='h';e.textContent=['❤️','💕','💗','🤍'][i%4];e.style.left=Math.random()*100+'vw';e.style.fontSize=14+Math.random()*26+'px';e.style.animationDuration=7+Math.random()*8+'s';e.style.animationDelay=-Math.random()*12+'s';document.body.appendChild(e)}</script></body></html>
